# Release: creates a GitHub Release and attaches the Windows installer and
# Linux package whenever a version tag (v*) is pushed — or when run manually
# from the Actions tab, for an environment that can't push a tag directly
# (a fine-grained credential without tag-ref permission, a tag protection
# rule, etc.): softprops/action-gh-release creates the tag itself as part of
# creating the release when given an explicit tag_name, so a git push of the
# tag was never actually required, only convenient.
#
# Not on PyPI, deliberately: this app ships as an installed Windows app via
# GitHub Releases (see BACKLOG.md §7), not as something `pip install`s, so a
# PyPI step would just be one more credential to manage and one more
# irreversible-publish footgun for a feature nobody downstream uses. If that
# ever changes, `pypa/gh-action-pypi-publish` is the action to reach for —
# see this file's git history for the job this replaced.
#
# Prerequisites, tag-push route:
#   git tag v0.1.0 && git push origin v0.1.0
# Prerequisites, manual route: Actions tab -> Release -> Run workflow ->
# enter "0.1.0" (no leading v) in the version box.
# Either way, before releasing: rename CHANGELOG.md's "## [Unreleased]"
# header to the version you're releasing (e.g. "## [0.1.0] - 2026-08-18")
# — the changelog-extraction step below matches on that exact number, and
# an empty match falls back to GitHub's auto-generated notes instead.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (no leading v)"
        required: true

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve from the tag push or the manual input
        id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  github-release:
    name: Create GitHub Release
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Pull the section between this version header and the next
          NOTES=$(awk "/^## \[?${VERSION}\]?/,/^## /" CHANGELOG.md | head -n -1 | tail -n +2)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          # Only meaningful on the manual-dispatch route — the tag doesn't
          # exist as a ref yet, so it's cut from whatever commit this run
          # itself is on. Ignored (a no-op) when the tag already exists,
          # i.e. the normal tag-push route.
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: ${{ steps.changelog.outputs.notes == '' }}

  build-windows-installer:
    name: Build Windows installer
    # After github-release, not in parallel with it: this job uploads an
    # asset to the release that job creates, via the same action run again
    # with the same tag — softprops/action-gh-release adds to an existing
    # release under that tag rather than making a second one, but only if
    # the release already exists by the time this runs.
    needs: [resolve-version, github-release]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # The base app's own deps, minus sentence-transformers/torch:
        # Settings -> Packages already treats semantic search as an
        # optional install fetched after the app is running (core/extras.py
        # id="semantic"), same as voice dictation and the desktop window
        # itself — bundling a torch download into the base installer would
        # be inconsistent with that and a few hundred MB for a feature this
        # build already has a working path to install on demand.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" SQLAlchemy alembic python-dotenv \
            requests numpy "fsspec[http]" bcrypt cryptography \
            python-multipart defusedxml pywebview pystray Pillow pyinstaller
          pip install -e . --no-deps

      - name: Build the frozen app (PyInstaller)
        shell: bash
        run: |
          pyinstaller packaging/windows/memorymap.spec --distpath dist --workpath build --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        env:
          MEMORYMAP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Upload installer to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: dist/installer/MemoryMap-AI-Setup-*.exe

  build-linux-package:
    name: Build Linux package
    # Same reasoning as build-windows-installer: uploads to the release
    # github-release just created, so it has to exist first.
    needs: [resolve-version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pywebview's Linux backend needs GTK/WebKit as system packages —
      # pip alone can't provide them.
      - name: Install GTK/WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install build dependencies
        # Same trimmed set as the Windows job (no sentence-transformers/
        # torch — see that job's own comment) and no pystray/Pillow: this
        # build ships without a system tray, see packaging/linux/
        # memorymap.spec's own comment for why.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" SQLAlchemy alembic python-dotenv \
            requests numpy "fsspec[http]" bcrypt cryptography \
            python-multipart pywebview pyinstaller
          pip install -e . --no-deps

      - name: Build the frozen app (PyInstaller)
        run: |
          pyinstaller packaging/linux/memorymap.spec --distpath dist --workpath build --noconfirm

      - name: Zip the build
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          cd dist
          zip -r "../MemoryMap-AI-${VERSION}-linux-x86_64.zip" "MemoryMap AI"

      - name: Upload package to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: MemoryMap-AI-*-linux-x86_64.zip
